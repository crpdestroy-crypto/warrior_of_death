name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarriorOfDeath-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Send APK to Telegram
        env:
          T_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.BOT_TOKEN }}
          T_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHAT_ID }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -n "$T_BOT_TOKEN" ] && [ -n "$T_CHAT_ID" ] && [ -f "$APK_PATH" ]; then
            echo "Sending APK to Telegram..."
            curl -F chat_id="$T_CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="Warrior of Death собран! Tap-to-move арена, волны, лут." \
                 https://api.telegram.org/bot$T_BOT_TOKEN/sendDocument
          else
            echo "Secrets not provided or APK missing, upload only."
          fi
